<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大同大學校園智能助理</title>
  <link rel="stylesheet" href="css/chatbox.css">
</head>
<body>
  <!-- 頁面背景模擬校園入口 -->
  <main class="landing-container">
    <h1>大同大學校園資訊入口</h1>
    <p>點擊右下角客服小幫手即可開始提問。</p>
  </main>

  <!-- 懸浮客服觸發按鈕 (Floating Action Button) -->
  <button id="chat-toggle-btn" class="chat-toggle" aria-label="開啟客服視窗">
    💬
  </button>

  <!-- 客服對話彈窗 -->
  <aside id="chat-window" class="chat-window hidden">
    <!-- 標題欄 (似 momo/PChome 客服頭像與在線狀態) -->
    <header class="chat-header">
      <div class="chat-avatar">🎓</div>
      <div class="chat-status-info">
        <span class="chat-title">大同校園小助理</span>
        <span class="chat-status">在線中</span>
      </div>
      <button id="chat-close-btn" class="chat-close" aria-label="關閉客服視窗">&times;</button>
    </header>

    <!-- 訊息對話滾動區 -->
    <section id="chat-messages" class="chat-messages">
      <div class="message-bubble bot">
        同學你好！我是大同校園智能客服。請點選下方常見問題，或直接在下方輸入你的問題喔！
      </div>
    </section>

    <!-- 快捷標籤列 (常見問題模組) -->
    <nav class="quick-pills-bar" id="quick-pills-container"></nav>

    <!-- 底部輸入與發送區 -->
    <footer class="chat-input-container">
      <input type="text" id="chat-input" placeholder="輸入你想查詢的校園問題..." autocomplete="off">
      <button id="send-btn" class="send-btn">發送</button>
    </footer>
  </aside>

  <!-- 邏輯腳本切分 -->
  <script src="js/quick_actions.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
